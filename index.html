<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aaruvi Builds — Delete Disintegration</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="brand">AARUVI BUILDS</div>
<main class="stage">
<section class="app" id="app">
<header class="topbar"><div class="mark">A</div><div><span class="eyebrow">MEDIA LIBRARY</span><h1>Project Archive</h1></div><div class="items"><b id="count">12</b><span>ITEMS</span></div></header>
<div class="content">
<div class="section-head"><div><span class="eyebrow">RECENT FILES</span><h2>Creative exports</h2></div><span class="view">GRID</span></div>
<div class="file-grid">
<div class="file-card selected" id="targetFile"><div class="thumb purple"></div><div class="file-meta"><strong>hero-final.fig</strong><small>8.4 MB</small></div><span class="selected-dot"></span></div>
<div class="file-card"><div class="thumb dark"></div><div class="file-meta"><strong>motion-v2.mp4</strong><small>18.6 MB</small></div></div>
<div class="file-card"><div class="thumb pale"></div><div class="file-meta"><strong>brand-assets.zip</strong><small>42.8 MB</small></div></div>
</div>
<div class="action-row"><span class="selection">1 ITEM SELECTED</span>
<button class="delete-btn" id="deleteBtn" type="button"><span class="trash"><i></i></span><span class="label">Delete</span><span class="spinner"></span><span class="delete-check">✓</span></button></div>
</div>
<div class="disintegrate-zone">
<div class="ghost-file"><div class="ghost-thumb"></div><strong>hero-final.fig</strong></div>
<div class="particles" id="particles"></div>
<div class="deleted-mark"><div class="empty-icon"></div><span>DELETED</span></div>
</div><div class="flash"></div>
</section>
<div class="caption" id="caption">DELETE SELECTED FILE</div>
</main>
<script src="script.js"></script></body></html>
